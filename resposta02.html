<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        div {
            margin-left: 500px;
            margin-right: 500px;
            background-color: rgb(189, 223, 243);
            border-radius: 20px;
        }
        
    </style> 
</head>
<body  >
    <div>
        <h1 align="center">Cadastro</h1>
        <form action="cadastro.php" method="post" autocomplete="on">
            <p align="center" >
                <label for="iusu" >Nome completo: </label><br>
        
                <input type="text" name="usu" id="iusu" required minlength="5" maxlength="15" size="50"
             autocomplete="username">
        
            </p>
            <p align="center">
                <label for="iemail">Email: </label><br>
                <input type="email" name="email" id="iemail" required size="50"  autocomplete="email">
        
            </p>
            <p align="center">
                <label for="isen">Crie uma senha de acesso: </label><br>
                <input type="password" name="sen" id="isen" required minlength="8" maxlength="20" size="50" autocomplete="current-password">
        
            </p>
            <p align="center">
                <input  type="submit" value="Enviar">
            </p>
        </form>
        
    </div>
</body>
</html>
